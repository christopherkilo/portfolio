<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Favicon-safe: bold core + readable accretion — same identity, fewer fine details -->
  <rect width="64" height="64" rx="14" fill="#0B0B0B"/>
  <defs>
    <radialGradient id="d" cx="50%" cy="50%" r="50%">
      <stop offset="38%" stop-color="#000"/>
      <stop offset="50%" stop-color="#FF8C2B" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#FF7A00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r" x1="10%" y1="50%" x2="90%" y2="50%">
      <stop offset="0%" stop-color="#C45400" stop-opacity="0.3"/>
      <stop offset="28%" stop-color="#FF8C2B" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#FFC27A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8A4200" stop-opacity="0.28"/>
    </linearGradient>
  </defs>
  <ellipse cx="32" cy="32" rx="26" ry="9.5" fill="url(#d)"/>
  <ellipse cx="32" cy="32" rx="22" ry="7" fill="none" stroke="url(#r)" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="13.4" fill="none" stroke="#FFC27A" stroke-width="1.4" opacity="0.9"/>
  <circle cx="32" cy="32" r="11.5" fill="#000"/>
</svg>
