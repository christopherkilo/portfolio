<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none">
  <!-- Portfolio cover — optically centered poster stack (static) -->
  <rect width="1200" height="750" fill="#0B0B0B"/>

  <defs>
    <radialGradient id="eh-card-disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="38%" stop-color="#000"/>
      <stop offset="48%" stop-color="#C45400" stop-opacity="0.32"/>
      <stop offset="56%" stop-color="#FF8C2B" stop-opacity="0.72"/>
      <stop offset="72%" stop-color="#FFC27A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0B0B0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eh-card-lens" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#FFC27A" stop-opacity="0.1"/>
      <stop offset="55%" stop-color="#FF7A00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eh-card-ring" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8A4200" stop-opacity="0.2"/>
      <stop offset="22%" stop-color="#FF7A00" stop-opacity="0.5"/>
      <stop offset="42%" stop-color="#FF8C2B" stop-opacity="0.82"/>
      <stop offset="58%" stop-color="#FFC27A" stop-opacity="0.9"/>
      <stop offset="78%" stop-color="#FFC27A" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#C45400" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="eh-card-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Soft atmosphere — restrained -->
  <circle cx="980" cy="70" r="200" fill="#FF8C2B" fill-opacity="0.035"/>
  <circle cx="120" cy="700" r="220" fill="#FF7A00" fill-opacity="0.028"/>

  <!--
    Hero composition — one vertically balanced stack.
    Optical center near mid-frame; even gaps mark → title → tagline.
    Black-hole size unchanged; static.
  -->
  <g transform="translate(600 266)" aria-hidden="true">
    <ellipse cx="0" cy="0" rx="168" ry="58" fill="url(#eh-card-lens)" opacity="0.55"/>

    <g>
      <ellipse cx="0" cy="0" rx="130" ry="44" fill="url(#eh-card-disc)"/>
      <ellipse
        cx="0"
        cy="0"
        rx="112"
        ry="34"
        fill="none"
        stroke="url(#eh-card-ring)"
        stroke-width="3.2"
        opacity="0.82"
        filter="url(#eh-card-glow)"
      />
      <!-- Symmetric brightness — keeps optical center on the core -->
      <ellipse cx="58" cy="-1" rx="24" ry="6.5" fill="#FFC27A" opacity="0.24" filter="url(#eh-card-glow)"/>
      <ellipse cx="-58" cy="2" rx="24" ry="6.5" fill="#C45400" opacity="0.22"/>
      <ellipse cx="18" cy="6" rx="14" ry="4.5" fill="#FFC27A" opacity="0.14"/>
      <ellipse cx="-22" cy="-5" rx="12" ry="4" fill="#C45400" opacity="0.16"/>
    </g>

    <circle cx="0" cy="0" r="48" fill="none" stroke="#FFC27A" stroke-width="2.2" opacity="0.55" filter="url(#eh-card-glow)"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#FF7A00" stroke-width="1" opacity="0.28"/>
    <circle cx="0" cy="0" r="42" fill="#000000"/>
  </g>

  <!-- Title — letter-spacing bias compensated so it shares the mark’s axis -->
  <text
    x="594"
    y="448"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="64"
    font-weight="700"
    letter-spacing="12"
  >EVENT HORIZON</text>

  <text
    x="600"
    y="538"
    text-anchor="middle"
    fill="#D1D5DB"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="600"
    letter-spacing="1.5"
  >Gravity made visible</text>
</svg>
