<header class="topnav">
  <div class="title-group">
    <button
      #menuButton
      type="button"
      class="icon-btn menu-btn"
      aria-label="Open sidebar"
      [attr.aria-expanded]="ui.mobileSidebarOpen()"
      aria-controls="tf-mobile-nav"
      (click)="ui.openMobileSidebar()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
    <div>
      <p class="kicker">TaskFlow</p>
      <h1 class="page-title">{{ pageTitle() }}</h1>
    </div>
  </div>

  <div class="actions">
    <button
      type="button"
      class="search-btn"
      disabled
      aria-disabled="true"
      aria-label="Search is unavailable in the Angular foundation"
      title="Command palette arrives in a later migration phase"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3-3" />
      </svg>
      <span class="search-label">Search</span>
      <span class="unavailable">Later</span>
    </button>

    <button
      type="button"
      class="icon-btn"
      [attr.aria-label]="ui.themeToggleLabel()"
      [title]="ui.themeToggleLabel()"
      (click)="ui.toggleTheme()"
    >
      <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"
        />
      </svg>
      <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5Z" />
      </svg>
    </button>

    <tf-presence-avatars />
    <tf-notification-menu />
    <tf-connection-indicator />

    <span
      class="avatar"
      [attr.aria-label]="'Current user ' + displayName()"
    >
      {{ initials() }}
    </span>
    <button
      type="button"
      class="icon-btn"
      aria-label="Sign out"
      [disabled]="signingOut()"
      (click)="onSignOut()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <path d="m16 17 5-5-5-5" />
        <path d="M21 12H9" />
      </svg>
    </button>
    @if (auth.logoutError()) {
      <p class="logout-error" role="alert">{{ auth.logoutError() }}</p>
    }
  </div>
</header>
